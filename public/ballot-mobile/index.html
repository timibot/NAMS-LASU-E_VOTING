<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAMS | Ballot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ballot-container">
      <header class="ballot-header">
        <div class="logo-group">
          <img src="../../assets/images/ballot-page-images/nams-logo.jpg" alt="NAMS Logo" class="header-logo" />
          <img src="../../assets/images/ballot-page-images/lasu-logo.png" alt="LASU Logo" class="header-logo" />
        </div>
        <h1>NAMS LASU E-VOTING PLATFORM</h1>
        <p>Nigerian Association of Microbiology Students</p>
      </header>

      <main class="site-content" role="main">
        <section class="candidates-section">
          <div id="vote-message"></div>
          <h2 class="section-title">MEET THE CANDIDATES & CAST YOUR VOTE</h2>

          <div class="card-grid" id="candidates-grid">
            </div>
        </section>
      </main>
    </div>

    <script src="./scripts.js" defer></script>
  </body>
</html>
